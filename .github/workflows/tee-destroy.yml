name: TEE Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target GitHub Environment to Destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      confirm_destroy:
        description: 'Type "DESTROY" to confirm teardown'
        required: true
        type: string
      resource_group_name:
        description: 'Azure Resource Group Name (optional override)'
        required: false
        type: string
      location:
        description: 'Azure Region (optional override)'
        required: false
        default: 'uksouth'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  tee-destroy:
    name: Destroy TEE Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: ./terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_environment: ${{ inputs.environment }}
      # Values below don't affect destroy behavior for resources already in state -
      # they only need to be set so Terraform doesn't prompt for required variables with no default.
      TF_VAR_admin_source_ip: "0.0.0.0/32"
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}

    steps:
      - name: Verify Confirmation
        working-directory: .
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::Confirmation text did not match 'DESTROY'. Aborting."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Set Terraform Variables
        run: |
          if [ -n "${{ inputs.resource_group_name }}" ]; then
            echo "TF_VAR_resource_group_name=${{ inputs.resource_group_name }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ inputs.location }}" ]; then
            echo "TF_VAR_location=${{ inputs.location }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.BACKEND_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=${{ inputs.environment }}.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
